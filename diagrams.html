<!doctype html><meta charset=utf-8><style>
:root{--ink:#1a1a1a;--paper:#fafaf7;--rule:#d8d4cc;--muted:#8a857c;--accent:#214D8A;
--ctx:#b8b3a8;--faint:#efece4;--green:#3a7d44;--amber:#c9a227;--red:#b3261e;}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);margin:0;padding:40px 28px 70px;font:16px/1.5 Charter,Georgia,serif}
.wrap{max-width:760px;margin:0 auto}
figure{margin:0 0 52px;padding:0}
.fignum{font:11px/1 "SF Mono",ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
.title{font-size:18px;font-weight:600;margin:2px 0 14px}
figcaption{font-size:13.5px;color:var(--muted);margin-top:10px;line-height:1.45}
figcaption b{color:var(--ink);font-weight:600}
.h{font:10px/1 "SF Mono",monospace;letter-spacing:.1em;text-transform:uppercase;fill:var(--muted)}
.term{font:13px/1.2 Charter,Georgia,serif;fill:var(--ink);font-weight:700}
.body{font:12px/1.3 Charter,Georgia,serif;fill:var(--ink)}
.mut{font:11.5px/1.3 Charter,Georgia,serif;fill:var(--muted)}
.mono{font:10px/1 "SF Mono",monospace;fill:var(--muted)}
.step{font:12.5px/1.2 Charter,Georgia,serif;fill:#fff;font-weight:700}
.sub{font:11px/1.2 Charter,Georgia,serif;fill:#eef}
.chip{font:10px/1 "SF Mono",monospace;font-weight:700}
svg{display:block;width:100%;height:auto}
</style><body><div class=wrap><figure><div class=fignum>Diagram A</div><div class=title>Inference, not measurement: the astronomy behind the method</div>
<svg viewBox="0 0 760 400">
<text x="78" y="26" class=h>In astronomy</text>
<text x="404" y="26" class=h>In this pipeline</text>
<line x1="372" y1="40" x2="372" y2="378" stroke="var(--rule)" stroke-width="1"/>
<path d="M44 67 L46.5 73.5 L53 76 L46.5 78.5 L44 85 L41.5 78.5 L35 76 L41.5 73.5 Z" fill="var(--accent)"/>
<text x="64" y="66" class=term>standard candle / the distance ladder</text>
<text x="64" y="84" class=mut><tspan x="64" dy="0">No one measures a star's distance directly; it is</tspan><tspan x="64" dy="14">inferred from brightness through a calibrated rule.</tspan></text>
<text x="384" y="66" class=body>→</text>
<text x="402" y="66" class=body><tspan x="402" dy="0">No realized price is visible. Each is built through</tspan><tspan x="402" dy="14">a chain of rules — ghost-strip, Medicare floor,</tspan><tspan x="402" dy="14">de-dup, Komodo weighting.</tspan></text>
<line x1="30" y1="126" x2="730" y2="126" stroke="var(--faint)" stroke-width="1"/>
<line x1="35" y1="160" x2="53" y2="160" stroke="var(--accent)" stroke-width="1.5"/>
<circle cx="38" cy="150" r="1.5" fill="var(--ctx)"/>
<circle cx="43" cy="147" r="1.5" fill="var(--ctx)"/>
<circle cx="48" cy="152" r="1.5" fill="var(--ctx)"/>
<circle cx="52" cy="149" r="1.5" fill="var(--ctx)"/>
<text x="64" y="146" class=term>the noise floor</text>
<text x="64" y="164" class=mut><tspan x="64" dy="0">Below a stated threshold above the noise, an</tspan><tspan x="64" dy="14">astronomer claims no detection, however suggestive</tspan><tspan x="64" dy="14">the data.</tspan></text>
<text x="384" y="146" class=body>→</text>
<text x="402" y="146" class=body><tspan x="402" dy="0">91.8% of posted rates are “ghosts” — below the</tspan><tspan x="402" dy="14">floor. They are discarded before any price is</tspan><tspan x="402" dy="14">graded.</tspan></text>
<line x1="30" y1="206" x2="730" y2="206" stroke="var(--faint)" stroke-width="1"/>
<line x1="36" y1="236" x2="52" y2="228" stroke="var(--accent)" stroke-width="1.5"/>
<line x1="36" y1="236" x2="52" y2="244" stroke="var(--ctx)" stroke-width="1.5"/>
<text x="64" y="226" class=term>the tension</text>
<text x="64" y="244" class=mut><tspan x="64" dy="0">When two trusted methods disagree on a measurement,</tspan><tspan x="64" dy="14">the gap is published, not smoothed away.</tspan></text>
<text x="384" y="226" class=body>→</text>
<text x="402" y="226" class=body><tspan x="402" dy="0">When the claims check and carrier-agreement</tspan><tspan x="402" dy="14">disagree, the grade reports the tension rather than</tspan><tspan x="402" dy="14">taking the kinder answer.</tspan></text>
<line x1="30" y1="286" x2="730" y2="286" stroke="var(--faint)" stroke-width="1"/>
<circle cx="36" cy="322" r="1.4" fill="var(--accent)"/>
<circle cx="41" cy="318" r="1.4" fill="var(--accent)"/>
<circle cx="46" cy="321" r="1.4" fill="var(--accent)"/>
<circle cx="50" cy="314" r="1.4" fill="var(--accent)"/>
<circle cx="53" cy="319" r="1.4" fill="var(--accent)"/>
<circle cx="38" cy="312" r="1.4" fill="var(--accent)"/>
<circle cx="47" cy="310" r="1.4" fill="var(--accent)"/>
<circle cx="44" cy="316" r="1.4" fill="var(--accent)"/>
<text x="64" y="306" class=term>the deep field</text>
<text x="64" y="324" class=mut><tspan x="64" dy="0">A blank-looking patch of sky resolves into thousands</tspan><tspan x="64" dy="14">of galaxies given enough exposure.</tspan></text>
<text x="384" y="306" class=body>→</text>
<text x="402" y="306" class=body><tspan x="402" dy="0">Three billion noisy rows resolve into a legible</tspan><tspan x="402" dy="14">field — each surviving price a point of light with a</tspan><tspan x="402" dy="14">stated confidence.</tspan></text>
</svg>
<figcaption>The recurring analogy, made explicit. Each rule in the pipeline is a calibrated rung; the grade is the calibration check the earlier rungs cannot perform on themselves.</figcaption></figure><figure><div class=fignum>Diagram B</div><div class=title>How a price is manufactured: the PP pipeline, raw MRF → graded price</div>
<svg viewBox="0 0 760 620">
<rect x="150" y="20" width="470" height="58" rx="6" fill="var(--ctx)"/>
<text x="166" y="44" class=step>INPUT — carrier & provider MRFs</text>
<text x="166" y="62" class=sub><tspan x="166" dy="0">~3.43B posted rates · ~92% “ghosts”</tspan></text>
<text x="136" y="54" text-anchor=end class=mono>3.43B</text>
<line x1="385.0" y1="78" x2="385.0" y2="104" stroke="var(--ctx)" stroke-width="1.5"/>
<path d="M381.0 98 L385.0 104 L389.0 98" fill="none" stroke="var(--ctx)" stroke-width="1.5"/>
<rect x="150" y="104" width="470" height="58" rx="6" fill="var(--accent)"/>
<text x="166" y="128" class=step>PP.0–1  Normalize</text>
<text x="166" y="146" class=sub><tspan x="166" dy="0">standardize codes · per-diem → per-procedure via CMS</tspan><tspan x="166" dy="12">length-of-stay · join Medicare benchmarks</tspan></text>
<text x="136" y="138" text-anchor=end class=mono>ghosts</text>
<text x="136" y="150" text-anchor=end class=mono>removed</text>
<line x1="385.0" y1="162" x2="385.0" y2="188" stroke="var(--ctx)" stroke-width="1.5"/>
<path d="M381.0 182 L385.0 188 L389.0 182" fill="none" stroke="var(--ctx)" stroke-width="1.5"/>
<rect x="150" y="188" width="470" height="58" rx="6" fill="var(--accent)"/>
<text x="166" y="212" class=step>PP.2–3  Combine</text>
<text x="166" y="230" class=sub><tspan x="166" dy="0">match carrier + provider rates; Komodo proximity ranking & value</tspan><tspan x="166" dy="12">substitution</tspan></text>
<line x1="385.0" y1="246" x2="385.0" y2="272" stroke="var(--ctx)" stroke-width="1.5"/>
<path d="M381.0 266 L385.0 272 L389.0 266" fill="none" stroke="var(--ctx)" stroke-width="1.5"/>
<rect x="150" y="272" width="470" height="58" rx="6" fill="var(--accent)"/>
<text x="166" y="296" class=step>PP.4  Komodo integration</text>
<text x="166" y="314" class=sub><tspan x="166" dy="0">utilization weights (provider_weight) · de-duplicate · flag</tspan><tspan x="166" dy="12">DRG-duplicate pricing</tspan></text>
<line x1="385.0" y1="330" x2="385.0" y2="356" stroke="var(--ctx)" stroke-width="1.5"/>
<path d="M381.0 350 L385.0 356 L389.0 350" fill="none" stroke="var(--ctx)" stroke-width="1.5"/>
<rect x="150" y="356" width="470" height="58" rx="6" fill="var(--accent)"/>
<text x="166" y="380" class=step>PP.5  Select & weight</text>
<text x="166" y="398" class=sub><tspan x="166" dy="0">carrier vs provider by proximity to Komodo cost →</tspan><tspan x="166" dy="12">negotiated_rate_final</tspan></text>
<line x1="385.0" y1="414" x2="385.0" y2="440" stroke="var(--ctx)" stroke-width="1.5"/>
<path d="M381.0 434 L385.0 440 L389.0 434" fill="none" stroke="var(--ctx)" stroke-width="1.5"/>
<rect x="150" y="440" width="470" height="58" rx="6" fill="var(--accent)"/>
<text x="166" y="464" class=step>PP.6  Grade</text>
<text x="166" y="482" class=sub><tspan x="166" dy="0">distance from Komodo claims cost: ≤20% GREEN · ≤40% YELLOW ·</tspan><tspan x="166" dy="12">else RED, + carrier-plan consistency</tspan></text>
<text x="150" y="532" class=term>Output — a graded price</text>
<rect x="150" y="546" width="57" height="22" rx="11" fill="var(--green)"/>
<text x="178.5" y="561" text-anchor=middle class=chip fill="#fff">GREEN</text>
<rect x="217" y="546" width="64" height="22" rx="11" fill="var(--amber)"/>
<text x="249.0" y="561" text-anchor=middle class=chip fill="#fff">YELLOW</text>
<rect x="291" y="546" width="43" height="22" rx="11" fill="var(--red)"/>
<text x="312.5" y="561" text-anchor=middle class=chip fill="#fff">RED</text>
<rect x="344" y="546" width="113" height="22" rx="11" fill="var(--ctx)"/>
<text x="400.5" y="561" text-anchor=middle class=chip fill="#fff">NOT-IN-KOMODO</text>
</svg>
<figcaption><b>Grounded in the production pipeline.</b> Steps and field names from the Starset post-processing methodology. The grade compares each built price to the Komodo claims cost; <b>PP.7 imputation is MMA-only — Starset does not impute</b>, and quality is assigned at the NPI + carrier + code level.</figcaption></figure></div>
